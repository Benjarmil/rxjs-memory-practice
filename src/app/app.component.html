@if(game$ | async; as game) {
  <h1 id="info">
    @if(game.info) { {{game.info}} }
    @else { Train your memory! }
  </h1>
  <div id="grid" class="grid parent">
      @for (child of cards; track child) {
        <div class="child"
          [id]="child"
          [class.highlighted]="game.highlightCard === child"
          [class.correct]="game.nextCard === child"
          (click)="clickSubject.next(child)"
        ></div>
      }
  </div>
}
